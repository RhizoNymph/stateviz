[workspace]
members = [
    "crates/cascade-core",
    "crates/cascade-layout",
    "crates/cascade-sim",
    "crates/cascade-scene",
    "crates/cascade-interop",
    "crates/cascade-cli",
    "crates/cascade-app",
]
# The GPUI app needs system graphics libraries and a long first build, so plain
# `cargo build` / `cargo test` at the root cover only the headless crates. Build
# the app with `cargo run -p cascade-app`.
default-members = [
    "crates/cascade-core",
    "crates/cascade-layout",
    "crates/cascade-sim",
    "crates/cascade-scene",
    "crates/cascade-interop",
    "crates/cascade-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
cascade-core = { path = "crates/cascade-core" }
cascade-layout = { path = "crates/cascade-layout" }
cascade-sim = { path = "crates/cascade-sim" }
cascade-scene = { path = "crates/cascade-scene" }
cascade-interop = { path = "crates/cascade-interop" }

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
saphyr = "0.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 2
