# The clock's timeout fires while the payment's cascade is still running.
# `timing: immediate` delivers it right after the capture, before OrderPaid
# reaches Fulfillment: the order is already paid, so the timeout is dropped
# and the shipment still starts.
scenario: timeout races the payment
instances:
  o1: { machine: Order, fields: { orderId: "1" } }
  s1: { machine: Shipment, fields: { orderId: "1" } }
steps:
  - { source: Customer, fire: Order.submit, target: o1 }
  - { source: PaymentGateway, fire: Order.capture_ok, target: o1 }
  - { source: Clock, fire: Order.timeout, target: o1, timing: immediate }
